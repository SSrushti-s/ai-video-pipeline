name: Sync YouTube AI Videos Every 6 Hours

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for instant testing

jobs:
  sync-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Optional: If using external DB
          INGEST_TO_DB: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      # Optional: If you are storing records as JSON in the repo, commit & push back
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync new AI videos [skip ci]" && git push)
